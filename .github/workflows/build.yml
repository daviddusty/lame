name: Build LAME for Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # Manual trigger
  #push:
  #  branches: [ "master", "stable" ]
  #pull_request:
  #  branches: [ "master", "stable" ]
  #push:
  #  branches:
  #    - master
  #    - stable

env:
  TAG: ${{ github.ref_name }}
  NASM_URL: https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
  LAME_STABLE_URL: https://downloads.sourceforge.net/project/lame/lame/4.0/lame-4.0.tar.gz
  LAME_SOL_FILE: vs2019_lame.sln
  LAME_MSBUILD_ARGS_X86: /maxcpucount /target:lame /property:Configuration=ReleaseNASM,Platform=Win32
  LAME_MSBUILD_ARGS_X64: /maxcpucount /target:lame /property:Configuration=Release,Platform=x64
  MPG123_URL_X86: https://mpg123.de/download/win32/1.33.5/mpg123-1.33.5-x86.zip
  MPG123_URL_X64: https://mpg123.de/download/win64/1.33.5/mpg123-1.33.5-x86-64.zip
  REPO_DIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install NASM
        run: |
          cd C:\
          Invoke-WebRequest -Uri "$env:NASM_URL" -OutFile "C:\nasm.zip"
          7z x "nasm.zip" | Out-Null
          Move-Item nasm-* NASM
          echo "C:\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\NASM\nasm.exe" -v

      - name: Fetch LAME source (stable release)
        run: |
          # Stop on the first cmdlet error instead of silently limping on
          # with a half-populated / missing lame_src directory.
          $ErrorActionPreference = "Stop"

          cd "$env:REPO_DIR"

          # Invoke-WebRequest -Uri "$env:LAME_STABLE_URL" -OutFile "$env:REPO_DIR\lame.tar.gz" -UserAgent "Mozilla/5.0"
          curl -L -o "$env:REPO_DIR\lame.tar.gz" "$env:LAME_STABLE_URL"
          $size = (Get-Item lame.tar.gz).Length
          Write-Host "Downloaded lame.tar.gz: $size bytes"
          if ($size -lt 100000) {
            # Sourceforge sometimes serves an HTML redirect/interstitial
            # page instead of the file; a real tarball is several hundred KB+.
            Write-Host (Get-Content lame.tar.gz -Raw)
            throw "Downloaded lame.tar.gz looks too small to be the real archive."
          }

          7z x "lame.tar.gz" -y | Out-Null
          7z x "*.tar" -y | Out-Null
          Remove-Item lame.tar.gz, *.tar -ErrorAction SilentlyContinue

          Write-Host "Directories present after extraction:"
          Get-ChildItem -Directory | Format-Table Name

          $extracted = Get-ChildItem -Directory -Filter "lame*" | Select-Object -First 1
          if (-not $extracted) {
            throw "Could not find an extracted 'lame*' directory after unpacking the tarball."
          }
          Move-Item $extracted.FullName "lame_src"

          if (-not (Test-Path "lame_src\vc_solution")) {
            throw "lame_src\vc_solution does not exist - source fetch/extraction failed."
          }
          Write-Host "lame_src\vc_solution contents:"
          Get-ChildItem "lame_src\vc_solution" | Format-Table Name

      - name: Download mpg123
        run: |
          $ErrorActionPreference = "Stop"
          cd "$env:REPO_DIR"
          New-Item -ItemType Directory -Force -Path "lame_src\vc_solution\mpg123" | Out-Null

          Invoke-WebRequest -Uri "$env:MPG123_URL_X86" -OutFile "mpg123_x86.zip"
          7z x "mpg123_x86.zip" | Out-Null
          Move-Item mpg123-* Win32
          Move-Item Win32 lame_src\vc_solution\mpg123

          Invoke-WebRequest -Uri "$env:MPG123_URL_X64" -OutFile "mpg123_x64.zip"
          7z x "mpg123_x64.zip" | Out-Null
          Move-Item mpg123-* x64
          Move-Item x64 lame_src\vc_solution\mpg123

      - name: Patch project files (v142 -> v145)
        run: |
          $ErrorActionPreference = "Stop"
          cd "$env:REPO_DIR"
          $files = @(
            "lame_src\vc_solution\vs2019_lame_lame.vcxproj",
            "lame_src\vc_solution\vs2019_lame_mp3rtp.vcxproj",
            "lame_src\vc_solution\vs2019_lame_mp3x.vcxproj",
            "lame_src\vc_solution\vs2019_libmp3lame.vcxproj",
            "lame_src\vc_solution\vs2019_libmp3lame_dll.vcxproj"
          )
          foreach ($f in $files) {
            (Get-Content $f) | ForEach-Object { $_ -replace 'v142', 'v145' } | Set-Content $f
          }

          $props = "lame_src\vc_solution\vs2019_libmpg123_config.props"
          (Get-Content $props) | ForEach-Object { $_ -replace '<HaveMpg123>false</', '<HaveMpg123>true</' } | Set-Content $props

      - name: Build (Win32)
        run: msbuild "$env:REPO_DIR\lame_src\vc_solution\$env:LAME_SOL_FILE" $env:LAME_MSBUILD_ARGS_X86.Split(' ')

      - name: Build (x64)
        run: msbuild "$env:REPO_DIR\lame_src\vc_solution\$env:LAME_SOL_FILE" $env:LAME_MSBUILD_ARGS_X64.Split(' ')

      - name: Package artifacts
        run: |
          $ErrorActionPreference = "Stop"
          cd "$env:REPO_DIR"
          New-Item -ItemType Directory -Force -Path win32, x64 | Out-Null

          Copy-Item "$env:REPO_DIR\lame_src\output\Win32\ReleaseNASM\lame.exe" "win32"
          Copy-Item "$env:REPO_DIR\lame_src\output\Win32\ReleaseNASM\lame.pdb" "win32"
          Copy-Item "$env:REPO_DIR\lame_src\output\Win32\ReleaseNASM\libmpg123-0.dll" "win32"

          Copy-Item "$env:REPO_DIR\lame_src\output\x64\Release\lame.exe" "x64"
          Copy-Item "$env:REPO_DIR\lame_src\output\x64\Release\lame.pdb" "x64"
          Copy-Item "$env:REPO_DIR\lame_src\output\x64\Release\libmpg123-0.dll" "x64"

          # 7z a -sfx7z.sfx -mx9 "lame.exe" "Readme.md" "win32" "x64"
          # $hash = (Get-FileHash -Algorithm SHA256 "lame.exe").Hash.ToString().ToLower()
          # "$hash *lame.exe" | Out-File -FilePath "lame.exe.sha256" -Encoding ascii

          dir
          7z a -mx9 "lame_${{ env.TAG }}.7z" "win32" "x64"
          $hash = (Get-FileHash -Algorithm SHA256 "lame_${{ env.TAG }}.7z").Hash.ToLower()
          "$hash *lame${{ env.TAG }}.7z" | Out-File -FilePath "lame${{ env.TAG }}.7z.sha256" -Encoding ascii

      - name: Upload lame.7z
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: ${{ env.REPO_DIR }}\lame_${{ env.TAG }}.7z

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: checksum
          path: ${{ env.REPO_DIR }}\lame_${{ env.TAG }}.7z.sha256

      - name: Release
        uses: softprops/action-gh-release@v3
        # if: github.ref_type == 'tag'
        with:
          files: |
            ${{ env.REPO_DIR }}\lame_${{ env.TAG }}.7z
            ${{ env.REPO_DIR }}\lame_${{ env.TAG }}.7z.sha256
